<!-- Application Logic & State Handlers (Firebase Realtime Sync + Local Backup) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVL3Ai42o7cnfgHBhKF6i-pnCpcXaNi4A",
      authDomain: "tablecash-portal.firebaseapp.com",
      databaseURL: "https://tablecash-portal-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tablecash-portal",
      storageBucket: "tablecash-portal.firebasestorage.app",
      messagingSenderId: "120116043168",
      appId: "1:120116043168:web:a0f792619b1758fe0398c5"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getDatabase(firebaseApp);
    let activeUnsubscribe = null;
    let isCloudConnected = false;

    function setConnectionStatus(online) {
      isCloudConnected = online;
      const badge = document.getElementById('connection-badge');
      if (!badge) return;
      if (online) {
        badge.className = "text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 flex items-center gap-1.5";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synced (Live)`;
      } else {
        badge.className = "text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30 flex items-center gap-1.5";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> Offline/Local Ready`;
      }
    }

    // Currency Formatter
    function formatINR(val) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(val || 0);
    }
    window.formatINR = formatINR;

    // Toast Utility
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      if (!toast || !msgEl) return;
      msgEl.innerText = msg;
      toast.classList.remove('translate-y-[-150%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }
    window.showToast = showToast;

    // Standard INR Denominations
    window.DENOMINATIONS = [
      { val: 500, type: 'note', label: '₹500' },
      { val: 200, type: 'note', label: '₹200' },
      { val: 100, type: 'note', label: '₹100' },
      { val: 50,  type: 'note', label: '₹50' },
      { val: 20,  type: 'note', label: '₹20' },
      { val: 10,  type: 'note', label: '₹10' },
      { val: 5,   type: 'coin', label: '₹5' },
      { val: 2,   type: 'coin', label: '₹2' },
      { val: 1,   type: 'coin', label: '₹1' }
    ];

    const DEFAULT_USERS = {
      admin: { name: 'Store Admin', role: 'admin', password: 'admin123' },
      emp1:  { name: 'Counter 1 (Employee 1)', role: 'employee', password: '1234' },
      emp2:  { name: 'Counter 2 (Employee 2)', role: 'employee', password: '1234' },
      emp3:  { name: 'Counter 3 (Employee 3)', role: 'employee', password: '1234' },
      emp4:  { name: 'Counter 4 (Employee 4)', role: 'employee', password: '1234' }
    };

    const DEFAULT_CASH_STATE = {
      emp1: { 500:0, 200:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, bookBalance: 0, comment: '', lastUpdated: null },
      emp2: { 500:0, 200:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, bookBalance: 0, comment: '', lastUpdated: null },
      emp3: { 500:0, 200:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, bookBalance: 0, comment: '', lastUpdated: null },
      emp4: { 500:0, 200:0, 100:0, 50:0, 20:0, 10:0, 5:0, 2:0, 1:0, bookBalance: 0, comment: '', lastUpdated: null }
    };

    const DEFAULT_ATTENDANCE_STATE = {
      emp1: { status: 'not_punched', punchIn: null, punchOut: null },
      emp2: { status: 'not_punched', punchIn: null, punchOut: null },
      emp3: { status: 'not_punched', punchIn: null, punchOut: null },
      emp4: { status: 'not_punched', punchIn: null, punchOut: null }
    };

    // Detect ?portal= query param if shared via link
    const urlParams = new URLSearchParams(window.location.search);
    const urlPortal = urlParams.get('portal');
    if (urlPortal) {
      const cleanPortal = urlPortal.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (cleanPortal) localStorage.setItem('active_portal_id', cleanPortal);
    }

    // State Variables
    window.portalUsers = JSON.parse(JSON.stringify(DEFAULT_USERS));
    window.portalCashData = JSON.parse(JSON.stringify(DEFAULT_CASH_STATE));
    window.portalHistoryLogs = [];
    window.portalAttendance = JSON.parse(JSON.stringify(DEFAULT_ATTENDANCE_STATE));
    window.portalAttendanceHistory = [];
    window.currentUser = null;
    window.activePortalId = localStorage.getItem('active_portal_id') || 'main-branch';

    // Chart instances
    window.chartInstanceBar = null;
    window.chartInstancePie = null;
    window.chartInstanceVariance = null;
    window.chartInstancePunchTimeline = null;
    window.chartInstancePunchFreq = null;

    function saveLocalCache() {
      const pid = window.activePortalId;
      localStorage.setItem(`portal_${pid}_users`, JSON.stringify(window.portalUsers));
      localStorage.setItem(`portal_${pid}_cash`, JSON.stringify(window.portalCashData));
      localStorage.setItem(`portal_${pid}_history`, JSON.stringify(window.portalHistoryLogs));
      localStorage.setItem(`portal_${pid}_attendance`, JSON.stringify(window.portalAttendance));
      localStorage.setItem(`portal_${pid}_att_history`, JSON.stringify(window.portalAttendanceHistory));
    }

    // Load Local Data Fallback
    function loadLocalData() {
      const pid = window.activePortalId;
      window.portalUsers = JSON.parse(JSON.stringify(DEFAULT_USERS));
      window.portalCashData = JSON.parse(JSON.stringify(DEFAULT_CASH_STATE));
      window.portalHistoryLogs = [];
      window.portalAttendance = JSON.parse(JSON.stringify(DEFAULT_ATTENDANCE_STATE));
      window.portalAttendanceHistory = [];

      const u = localStorage.getItem(`portal_${pid}_users`);
      const c = localStorage.getItem(`portal_${pid}_cash`);
      const h = localStorage.getItem(`portal_${pid}_history`);
      const a = localStorage.getItem(`portal_${pid}_attendance`);
      const ah = localStorage.getItem(`portal_${pid}_att_history`);

      if (u) { try { window.portalUsers = { ...DEFAULT_USERS, ...JSON.parse(u) }; } catch(e){} }
      if (c) { try { window.portalCashData = { ...DEFAULT_CASH_STATE, ...JSON.parse(c) }; } catch(e){} }
      if (h) { try { window.portalHistoryLogs = JSON.parse(h) || []; } catch(e){} }
      if (a) { try { window.portalAttendance = { ...DEFAULT_ATTENDANCE_STATE, ...JSON.parse(a) }; } catch(e){} }
      if (ah) { try { window.portalAttendanceHistory = JSON.parse(ah) || []; } catch(e){} }
    }

    // Real-time Firebase Listener for the active Portal ID
    function subscribeToPortalCloud() {
      if (activeUnsubscribe) {
        activeUnsubscribe();
        activeUnsubscribe = null;
      }

      const pid = window.activePortalId;
      const portalRef = ref(db, `portals/${pid}`);

      activeUnsubscribe = onValue(portalRef, (snapshot) => {
        setConnectionStatus(true);
        const cloudVal = snapshot.val();

        if (cloudVal) {
          if (cloudVal.users) window.portalUsers = { ...DEFAULT_USERS, ...cloudVal.users };
          if (cloudVal.cashData) {
            ['emp1', 'emp2', 'emp3', 'emp4'].forEach(k => {
              window.portalCashData[k] = { ...DEFAULT_CASH_STATE[k], ...(cloudVal.cashData[k] || {}) };
            });
          }
          window.portalHistoryLogs = Array.isArray(cloudVal.historyLogs)
            ? cloudVal.historyLogs
            : (cloudVal.historyLogs ? Object.values(cloudVal.historyLogs) : []);
          if (cloudVal.attendance) {
            ['emp1', 'emp2', 'emp3', 'emp4'].forEach(k => {
              window.portalAttendance[k] = { ...DEFAULT_ATTENDANCE_STATE[k], ...(cloudVal.attendance[k] || {}) };
            });
          }
          window.portalAttendanceHistory = Array.isArray(cloudVal.attendanceHistory)
            ? cloudVal.attendanceHistory
            : (cloudVal.attendanceHistory ? Object.values(cloudVal.attendanceHistory) : []);

          saveLocalCache();
          populateLoginDropdown();

          if (window.currentUser) {
            if (window.currentUser.role === 'admin') {
              renderAdminDashboard();
            } else {
              renderEmployeeCalculator(false);
            }
          }
        } else {
          // Initialize cloud node if this portal doesn't exist in Firebase yet
          pushToCloud();
        }
      }, (error) => {
        console.error("Firebase sync error:", error);
        setConnectionStatus(false);
      });
    }

    async function pushToCloud() {
      saveLocalCache();
      const pid = window.activePortalId;
      try {
        await set(ref(db, `portals/${pid}`), {
          users: window.portalUsers,
          cashData: window.portalCashData,
          historyLogs: window.portalHistoryLogs,
          attendance: window.portalAttendance,
          attendanceHistory: window.portalAttendanceHistory,
          updatedAt: Date.now()
        });
        setConnectionStatus(true);
      } catch (err) {
        console.error("Cloud save failed, kept in local backup:", err);
        setConnectionStatus(false);
        showToast("Saved locally (Cloud offline)");
      }
    }
    window.pushToCloud = pushToCloud;

    // Time Formatting Utilities
    function getCurrentDateTimeStamp() {
      const now = new Date();
      const datePart = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      const timePart = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
      return `${datePart} at ${timePart}`;
    }
    window.getCurrentDateTimeStamp = getCurrentDateTimeStamp;

    function parseTimeToDecimalHours(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return null;
      return dateObj.getHours() + (dateObj.getMinutes() / 60) + (dateObj.getSeconds() / 3600);
    }

    function formatDecimalHoursToString(dec) {
      if (dec === null || dec === undefined || isNaN(dec)) return "--:-- --";
      const totalMinutes = Math.round(dec * 60);
      const hours = Math.floor(totalMinutes / 60) % 24;
      const minutes = totalMinutes % 60;
      const period = hours >= 12 ? 'PM' : 'AM';
      const displayHour = hours % 12 === 0 ? 12 : hours % 12;
      return `${displayHour < 10 ? '0' : ''}${displayHour}:${minutes < 10 ? '0' : ''}${minutes} ${period}`;
    }

    function updatePortalDisplays() {
      const disp = document.getElementById('current-portal-display');
      if (disp) disp.innerText = window.activePortalId;

      const shareLinkEl = document.getElementById('shareable-portal-url');
      if (shareLinkEl) {
        shareLinkEl.innerText = `${window.location.origin}${window.location.pathname}?portal=${encodeURIComponent(window.activePortalId)}`;
      }
    }

    function populateLoginDropdown() {
      const users = window.portalUsers || {};
      const select = document.getElementById('login-username');
      if (!select) return;
      
      const adminName = users.admin ? users.admin.name : 'Store Admin';
      const e1 = users.emp1 ? users.emp1.name : 'Counter 1';
      const e2 = users.emp2 ? users.emp2.name : 'Counter 2';
      const e3 = users.emp3 ? users.emp3.name : 'Counter 3';
      const e4 = users.emp4 ? users.emp4.name : 'Counter 4';

      const currentVal = select.value;
      select.innerHTML = `
        <option value="admin">${adminName} (All Counters View)</option>
        <option value="emp1">${e1}</option>
        <option value="emp2">${e2}</option>
        <option value="emp3">${e3}</option>
        <option value="emp4">${e4}</option>
      `;
      if (currentVal) select.value = currentVal;
    }

    function handleLogin(e) {
      e.preventDefault();
      const users = window.portalUsers;
      const username = document.getElementById('login-username').value;
      const pass = document.getElementById('login-password').value;

      const userConfig = users[username];
      if (!userConfig || userConfig.password !== pass) {
        showToast("Incorrect password. Please try again.");
        return;
      }

      window.currentUser = { username, ...userConfig };
      document.getElementById('login-password').value = '';
      
      document.getElementById('header-actions').classList.remove('hidden');
      document.getElementById('header-actions').classList.add('flex');
      document.getElementById('logged-user-display').innerText = window.currentUser.name;

      document.getElementById('login-view').classList.add('hidden');
      if (window.currentUser.role === 'admin') {
        renderAdminDashboard();
        document.getElementById('admin-view').classList.remove('hidden');
      } else {
        renderEmployeeCalculator(true);
        document.getElementById('employee-view').classList.remove('hidden');
      }

      showToast(`Welcome, ${window.currentUser.name}`);
      if (window.lucide) lucide.createIcons();
    }
    window.handleLogin = handleLogin;

    function handleLogout() {
      window.currentUser = null;
      document.getElementById('header-actions').classList.add('hidden');
      document.getElementById('header-actions').classList.remove('flex');
      document.getElementById('employee-view').classList.add('hidden');
      document.getElementById('admin-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      populateLoginDropdown();
      showToast("Logged out successfully");
      if (window.lucide) lucide.createIcons();
    }
    window.handleLogout = handleLogout;

    // Step +/- Handler
    function stepCount(denomVal, delta) {
      const input = document.getElementById(`qty-${denomVal}`);
      let cur = parseInt(input.value) || 0;
      cur = Math.max(0, cur + delta);
      input.value = cur === 0 ? '' : cur;
      recalculateEmployee();
    }
    window.stepCount = stepCount;

    // Attendance Handlers
    async function handlePunchIn() {
      if (!window.currentUser || window.currentUser.role !== 'employee') return;
      const u = window.currentUser.username;
      const stamp = getCurrentDateTimeStamp();
      const epoch = Date.now();

      window.portalAttendance[u] = {
        status: 'on_duty',
        punchIn: stamp,
        punchOut: null
      };

      window.portalAttendanceHistory.unshift({
        type: 'PUNCH_IN',
        username: u,
        staffName: window.currentUser.name,
        timestampStr: stamp,
        timestampEpoch: epoch
      });

      await pushToCloud();
      renderEmployeeCalculator(false);
      showToast(`Punched In at ${stamp}`);
    }
    window.handlePunchIn = handlePunchIn;

    async function handlePunchOut() {
      if (!window.currentUser || window.currentUser.role !== 'employee') return;
      const u = window.currentUser.username;
      const stamp = getCurrentDateTimeStamp();
      const epoch = Date.now();

      const cur = window.portalAttendance[u] || {};
      window.portalAttendance[u] = {
        status: 'completed',
        punchIn: cur.punchIn || stamp,
        punchOut: stamp
      };

      window.portalAttendanceHistory.unshift({
        type: 'PUNCH_OUT',
        username: u,
        staffName: window.currentUser.name,
        timestampStr: stamp,
        timestampEpoch: epoch
      });

      await pushToCloud();
      renderEmployeeCalculator(false);
      showToast(`Punched Out at ${stamp}`);
    }
    window.handlePunchOut = handlePunchOut;

    // Render Employee View
    function renderEmployeeCalculator(resetFromData = true) {
      if (!window.currentUser || window.currentUser.role !== 'employee') return;

      const users = window.portalUsers;
      const myInfo = users[window.currentUser.username] || window.currentUser;
      document.getElementById('emp-counter-title').innerText = `${myInfo.name} - Table Cash`;
      
      const counts = (window.portalCashData && window.portalCashData[window.currentUser.username]) || {};
      const hasExistingSubmission = !!counts.lastUpdated;
      
      const stampEl = document.getElementById('emp-last-timestamp');
      if (stampEl) stampEl.innerText = counts.lastUpdated || 'Not yet submitted today';

      const editBadge = document.getElementById('emp-edit-badge');
      const resubmitHint = document.getElementById('emp-resubmit-hint');
      const saveBtnText = document.getElementById('emp-save-btn-text');
      const saveBtnIcon = document.getElementById('emp-save-btn-icon');

      if (hasExistingSubmission) {
        if (editBadge) editBadge.classList.remove('hidden');
        if (resubmitHint) resubmitHint.classList.remove('hidden');
        if (saveBtnText) saveBtnText.innerText = 'Update & Resubmit Table Cash';
        if (saveBtnIcon) saveBtnIcon.setAttribute('data-lucide', 'refresh-cw');
      } else {
        if (editBadge) editBadge.classList.add('hidden');
        if (resubmitHint) resubmitHint.classList.add('hidden');
        if (saveBtnText) saveBtnText.innerText = 'Save Table Cash & Enteportal Balance';
        if (saveBtnIcon) saveBtnIcon.setAttribute('data-lucide', 'cloud-upload');
      }

      // Update Attendance Card UI
      const attInfo = (window.portalAttendance && window.portalAttendance[window.currentUser.username]) || { status: 'not_punched' };
      const attPill = document.getElementById('emp-att-status-pill');
      const inEl = document.getElementById('emp-punch-in-time');
      const outEl = document.getElementById('emp-punch-out-time');
      const btnIn = document.getElementById('btn-punch-in');
      const btnOut = document.getElementById('btn-punch-out');

      if (inEl) inEl.innerText = attInfo.punchIn || '--:-- --';
      if (outEl) outEl.innerText = attInfo.punchOut || '--:-- --';

      if (attPill) {
        if (attInfo.status === 'on_duty') {
          attPill.innerText = 'Active On Duty';
          attPill.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
          if (btnIn) btnIn.disabled = true;
          if (btnIn) btnIn.className = 'flex-1 py-2 px-3 bg-slate-800 text-slate-500 rounded-xl text-xs font-bold cursor-not-allowed';
          if (btnOut) btnOut.disabled = false;
          if (btnOut) btnOut.className = 'flex-1 py-2 px-3 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 font-bold rounded-xl text-xs transition';
        } else if (attInfo.status === 'completed') {
          attPill.innerText = 'Shift Completed';
          attPill.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-teal-500/10 text-teal-300 border border-teal-500/30';
          if (btnIn) btnIn.disabled = false;
          if (btnIn) btnIn.className = 'flex-1 py-2 px-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition';
          if (btnOut) btnOut.disabled = true;
          if (btnOut) btnOut.className = 'flex-1 py-2 px-3 bg-slate-800 text-slate-500 rounded-xl text-xs font-bold cursor-not-allowed';
        } else {
          attPill.innerText = 'Not Punched In';
          attPill.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700';
          if (btnIn) btnIn.disabled = false;
          if (btnIn) btnIn.className = 'flex-1 py-2 px-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-xs transition';
          if (btnOut) btnOut.disabled = true;
          if (btnOut) btnOut.className = 'flex-1 py-2 px-3 bg-slate-800 text-slate-500 rounded-xl text-xs font-bold cursor-not-allowed';
        }
      }

      const bookBalInput = document.getElementById('emp-book-balance');
      if (bookBalInput && resetFromData) {
        bookBalInput.value = (counts.bookBalance !== undefined && counts.bookBalance !== null && counts.bookBalance !== '') ? counts.bookBalance : '';
      }

      const commentInput = document.getElementById('emp-reconciliation-comment');
      if (commentInput && resetFromData) {
        commentInput.value = counts.comment || '';
      }

      const tbody = document.getElementById('denom-rows');
      if (!resetFromData && tbody && tbody.children.length > 0) {
        recalculateEmployee();
        return;
      }

      if (tbody) {
        tbody.innerHTML = '';
        window.DENOMINATIONS.forEach(d => {
          const qty = counts[d.val] || '';
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-800/40 transition-colors";
          tr.innerHTML = `
            <td class="py-2.5 px-3">
              <span class="font-bold mono text-sm text-slate-100">${d.label}</span>
            </td>
            <td class="py-2.5 px-3 text-center">
              ${d.type === 'note' 
                ? '<span class="text-[11px] font-semibold text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">Note</span>' 
                : '<span class="text-[11px] font-semibold text-sky-300 bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20">Coin</span>'}
            </td>
            <td class="py-2.5 px-3 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button type="button" onclick="stepCount(${d.val}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold flex items-center justify-center border border-slate-700 active:scale-95 transition">-</button>
                <input 
                  type="number" 
                  id="qty-${d.val}" 
                  min="0" 
                  placeholder="0" 
                  value="${qty}"
                  oninput="recalculateEmployee()"
                  onfocus="this.select()"
                  class="mono w-20 text-center bg-slate-950 border border-slate-700 focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 rounded-lg py-1 px-2 text-sm font-bold text-white placeholder-slate-600 outline-none transition"
                >
                <button type="button" onclick="stepCount(${d.val}, 1)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold flex items-center justify-center border border-slate-700 active:scale-95 transition">+</button>
              </div>
            </td>
            <td class="py-2.5 px-3 text-right mono font-bold text-slate-200" id="subtotal-${d.val}">
              ₹0.00
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      recalculateEmployee();
      if (window.lucide) lucide.createIcons();
    }
    window.renderEmployeeCalculator = renderEmployeeCalculator;

    function recalculateEmployee() {
      let totalAmount = 0;
      let totalNotes = 0;
      let totalCoins = 0;

      window.DENOMINATIONS.forEach(d => {
        const input = document.getElementById(`qty-${d.val}`);
        const qty = input ? (parseInt(input.value) || 0) : 0;
        const subtotal = qty * d.val;
        totalAmount += subtotal;

        if (d.type === 'note') totalNotes += qty;
        else totalCoins += qty;

        const subEl = document.getElementById(`subtotal-${d.val}`);
        if (subEl) subEl.innerText = formatINR(subtotal);
      });

      const topTotalEl = document.getElementById('emp-top-total');
      if (topTotalEl) topTotalEl.innerText = formatINR(totalAmount);

      const reconcilePhysicalEl = document.getElementById('emp-reconcile-physical');
      if (reconcilePhysicalEl) reconcilePhysicalEl.innerText = formatINR(totalAmount);

      const notesEl = document.getElementById('emp-total-notes');
      if (notesEl) notesEl.innerText = `${totalNotes} notes`;

      const coinsEl = document.getElementById('emp-total-coins');
      if (coinsEl) coinsEl.innerText = `${totalCoins} coins`;

      const pcsEl = document.getElementById('emp-total-pieces');
      if (pcsEl) pcsEl.innerText = `${totalNotes + totalCoins} pcs`;

      // Book Balance Reconciliation Logic
      const bookInput = document.getElementById('emp-book-balance');
      const diffValEl = document.getElementById('emp-diff-value');
      const diffLblEl = document.getElementById('emp-diff-label');
      const diffCardEl = document.getElementById('emp-diff-card');

      if (bookInput && diffValEl && diffLblEl && diffCardEl) {
        const rawBookVal = bookInput.value.trim();
        if (rawBookVal === '') {
          diffValEl.innerText = '₹0.00';
          diffValEl.className = 'mono text-xl font-black text-slate-400';
          diffLblEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-500"></span> Enter Enteportal balance';
          diffCardEl.className = 'bg-slate-950/80 border border-slate-800 rounded-xl p-3 transition-colors';
        } else {
          const bookVal = parseFloat(rawBookVal) || 0;
          const diff = totalAmount - bookVal;

          if (Math.abs(diff) < 0.01) {
            diffValEl.innerText = '₹0.00';
            diffValEl.className = 'mono text-xl font-black text-emerald-400';
            diffLblEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Exactly Balanced (Matched)';
            diffCardEl.className = 'bg-slate-950/80 border border-emerald-500/40 rounded-xl p-3 transition-colors shadow-lg shadow-emerald-500/5';
          } else if (diff > 0) {
            diffValEl.innerText = `+${formatINR(diff)}`;
            diffValEl.className = 'mono text-xl font-black text-teal-300';
            diffLblEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-teal-400"></span> Surplus / Cash Excess (+₹)';
            diffCardEl.className = 'bg-slate-950/80 border border-teal-500/40 rounded-xl p-3 transition-colors shadow-lg shadow-teal-500/5';
          } else {
            diffValEl.innerText = `-${formatINR(Math.abs(diff))}`;
            diffValEl.className = 'mono text-xl font-black text-rose-400';
            diffLblEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span> Deficit / Cash Shortage (-₹)';
            diffCardEl.className = 'bg-slate-950/80 border border-rose-500/40 rounded-xl p-3 transition-colors shadow-lg shadow-rose-500/5';
          }
        }
      }
    }
    window.recalculateEmployee = recalculateEmployee;

    async function saveAndSyncCloud() {
      if (!window.currentUser || window.currentUser.role !== 'employee') return;

      const existingData = (window.portalCashData && window.portalCashData[window.currentUser.username]) || {};
      const isResubmission = !!existingData.lastUpdated;

      const updatedCounts = {};
      let submitTotal = 0;
      let submitNotes = 0;
      let submitCoins = 0;

      window.DENOMINATIONS.forEach(d => {
        const input = document.getElementById(`qty-${d.val}`);
        const qty = input ? (parseInt(input.value) || 0) : 0;
        updatedCounts[d.val] = qty;
        submitTotal += (qty * d.val);
        if (d.type === 'note') submitNotes += qty;
        else submitCoins += qty;
      });

      const bookInput = document.getElementById('emp-book-balance');
      const bookBalanceVal = (bookInput && bookInput.value.trim() !== '') ? parseFloat(bookInput.value.trim()) : 0;
      const differenceVal = submitTotal - bookBalanceVal;
      updatedCounts.bookBalance = bookBalanceVal;

      const commentInput = document.getElementById('emp-reconciliation-comment');
      const commentVal = commentInput ? commentInput.value.trim() : '';
      updatedCounts.comment = commentVal;

      const savedStamp = getCurrentDateTimeStamp();
      const nowEpoch = Date.now();
      updatedCounts.lastUpdated = savedStamp;
      updatedCounts.isRevised = isResubmission;
      window.portalCashData[window.currentUser.username] = updatedCounts;

      if (!Array.isArray(window.portalHistoryLogs)) window.portalHistoryLogs = [];
      const users = window.portalUsers || {};
      const staffName = (users[window.currentUser.username] && users[window.currentUser.username].name) || window.currentUser.name || 'Counter';

      window.portalHistoryLogs.unshift({
        id: 'hist_' + nowEpoch + '_' + Math.random().toString(36).substring(2, 6),
        username: window.currentUser.username,
        staffName: staffName,
        timestampStr: savedStamp,
        timestampEpoch: nowEpoch,
        totalAmount: submitTotal,
        bookBalance: bookBalanceVal,
        difference: differenceVal,
        comment: commentVal,
        notesCount: submitNotes,
        coinsCount: submitCoins,
        isRevised: isResubmission,
        denominations: { ...updatedCounts }
      });

      await pushToCloud();
      showToast(isResubmission ? `Synced & updated at: ${savedStamp}` : `Synced to cloud at: ${savedStamp}`);

      openSubmitSuccessModal({
        staffName: staffName,
        timestamp: savedStamp,
        totalAmount: submitTotal,
        bookBalance: bookBalanceVal,
        diff: differenceVal,
        isRevised: isResubmission
      });
      renderEmployeeCalculator(false);
    }
    window.saveAndSyncCloud = saveAndSyncCloud;
